<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlimpMate Display Receiver</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #display {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        background: #000;
      }

      #status {
        position: fixed;
        left: 24px;
        bottom: 24px;
        z-index: 2;
        max-width: min(720px, calc(100vw - 48px));
        padding: 14px 18px;
        border-radius: 14px;
        color: #f6f7fb;
        background: rgba(0, 0, 0, 0.68);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.42);
        font-size: 22px;
        font-weight: 700;
        line-height: 1.35;
        letter-spacing: 0.01em;
        white-space: pre-line;
        transition: opacity 220ms ease;
      }

      body.receiving #status {
        opacity: 0.08;
      }

      body.debug #status,
      body.receiving.debug #status {
        opacity: 1;
      }

      #debug {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 3;
        display: none;
        max-width: min(760px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        box-sizing: border-box;
        margin: 0;
        padding: 12px 14px;
        border-radius: 12px;
        color: #d7ffdf;
        background: rgba(0, 0, 0, 0.78);
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        white-space: pre-wrap;
      }

      body.debug #debug {
        display: block;
      }
    </style>
  </head>
  <body>
    <video id="display" autoplay playsinline muted></video>
    <div id="status" role="status" aria-live="polite">waiting-for-sender</div>
    <pre id="debug" aria-live="polite" hidden></pre>
    <script src="/display/display-receiver.bundle.js"></script>
  </body>
</html>
