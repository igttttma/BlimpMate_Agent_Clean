<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live2D Runtime</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./live2dcubismcore.min.js"></script>
  </head>
  <body>
    <div class="shell">
      <main class="model-frame" id="modelFrame"></main>

      <button class="panel-toggle" id="panelToggle" type="button" aria-label="Toggle debug panel">Debug</button>

      <aside class="panel" id="debugPanel" hidden>
        <div class="panel-scroll">
          <div class="panel-header">
            <div>
              <div class="panel-title">Debug Panel</div>
              <div class="panel-note">Live2D parameter controls</div>
            </div>
            <button class="panel-close" id="panelClose" type="button" aria-label="Close debug panel">Close</button>
          </div>

          <div class="hud">
            <div><span>Current</span><strong id="currentExpr">None</strong></div>
            <div><span>Target</span><strong id="targetExpr">None</strong></div>
            <div><span>Eye</span><strong id="eyeValue">0.00 / 0.00</strong></div>
            <div><span>Mouth</span><strong id="mouthValue">0.00 / 0.00</strong></div>
          </div>

          <div class="section">
            <div class="section-label">Expressions</div>
            <div class="button-grid" id="expressionButtons"></div>
          </div>

          <div class="section">
            <div class="section-label">Motion</div>
            <div class="row">
              <button class="action-btn" id="blinkBtn" type="button">Blink</button>
              <button class="action-btn" id="clearBtn" type="button">Clear</button>
            </div>
          </div>

          <div class="section">
            <div class="section-label">Random Controls</div>
            <label class="switch"><input id="eyeToggle" type="checkbox" checked /> Random eye</label>
            <label class="switch"><input id="browToggle" type="checkbox" checked /> Random brow</label>
            <label class="switch"><input id="mouthToggle" type="checkbox" checked /> Random mouth</label>
            <label class="switch"><input id="recoverToggle" type="checkbox" checked /> Auto recover expression</label>
          </div>

          <div class="section">
            <div class="section-label">Parameters</div>
            <div class="sliders">
              <label><span>Blink min</span><input id="blinkMin" type="range" min="0.5" max="12" step="0.1" value="5" /></label>
              <label><span>Blink max</span><input id="blinkMax" type="range" min="1" max="15" step="0.1" value="10" /></label>
              <label><span>Eye range</span><input id="eyeRange" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
              <label><span>Eye speed</span><input id="eyeSpeed" type="range" min="0.1" max="5" step="0.1" value="1" /></label>
              <label><span>Mouth range</span><input id="mouthRange" type="range" min="0" max="1" step="0.01" value="0.4" /></label>
            </div>
          </div>

          <div class="section">
            <div class="section-label">Snapshot</div>
            <pre id="snapshot"></pre>
          </div>
        </div>
      </aside>
    </div>

    <script src="./renderer.bundle.js"></script>
  </body>
</html>
