plugins {
    id "com.android.application"
}

// BlimpMate Speaker: plays what the Blimp plays (the AI's voice, portal audio
// clips, video soundtracks) on a second device wired to a big speaker. Connects
// to xz-server's /xiaozhi/speaker/ socket; see core/speaker_hub.py there.
android {
    namespace "com.blimpmate.speaker"
    compileSdk 35

    defaultConfig {
        applicationId "com.blimpmate.speaker"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            def storeFilePath = project.findProperty("BM_RELEASE_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword project.findProperty("BM_RELEASE_STORE_PASSWORD")
                keyAlias project.findProperty("BM_RELEASE_KEY_ALIAS")
                keyPassword project.findProperty("BM_RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig project.findProperty("BM_RELEASE_STORE_FILE") != null ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
}
